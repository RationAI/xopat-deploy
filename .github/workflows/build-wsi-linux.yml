name: Build WSI-Service Linux
run-name: "WSI-Service Linux ${{ inputs.tag || github.ref_name }} (ref=${{ inputs.ref || github.ref_name }})"

on:
  push:
    tags:
      - 'wsi-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. wsi-v1.0.0)'
        required: true
        type: string
      ref:
        description: 'Branch to build from. Leave empty to use the branch selected above.'
        required: false
        type: string

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout WSI-Service submodule
        run: git submodule update --init --recursive external/wsi-service

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build script
        run: |
          chmod +x scripts/linux/build_wsi_service.sh
          scripts/linux/build_wsi_service.sh

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package artifact
        run: |
          cd dist/wsi_service_binary
          zip -r "../../wsi_service_binary_linux_${{ steps.tag.outputs.value }}.zip" .

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "wsi_service_binary_linux_${{ steps.tag.outputs.value }}.zip" \
            > "wsi_service_binary_linux_${{ steps.tag.outputs.value }}.zip.sha256"
          cat "wsi_service_binary_linux_${{ steps.tag.outputs.value }}.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: |
            wsi_service_binary_linux_*.zip
            wsi_service_binary_linux_*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
