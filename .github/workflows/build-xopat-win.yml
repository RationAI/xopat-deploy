name: Build xOpat Windows
run-name: "xOpat Windows ${{ inputs.tag || github.ref_name }} (ref=${{ inputs.ref || github.ref_name }})"

on:
  push:
    tags:
      - 'xopat-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. xopat-v1.0.0)'
        required: true
        type: string
      ref:
        description: 'Branch to build from. Leave empty to use the branch selected above.'
        required: false
        type: string
      xopat_ref:
        description: 'xOpat submodule ref (branch, tag, or SHA). Default: release/v3.'
        required: false
        type: string
        default: 'release/v3'

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout xOpat submodule at requested ref
        shell: bash
        run: |
          XOPAT_REF="${{ inputs.xopat_ref || 'release/v3' }}"
          git submodule update --init external/xopat
          cd external/xopat
          git fetch origin "$XOPAT_REF"
          git checkout FETCH_HEAD
          echo "xOpat submodule now at $(git rev-parse HEAD) (ref: $XOPAT_REF)"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pkg
        run: npm install -g pkg

      - name: Run build script
        shell: pwsh
        run: scripts\windows\build_xopat.ps1

      - name: Determine tag name
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "value=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\xopat\* `
            -DestinationPath "xopat_windows_${{ steps.tag.outputs.value }}.zip"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $zip = "xopat_windows_${{ steps.tag.outputs.value }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          # sha256sum-compatible: "<hex>  <filename>"
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-Content "$zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: |
            xopat_windows_*.zip
            xopat_windows_*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
