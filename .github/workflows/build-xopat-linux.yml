name: Build xOpat Linux
run-name: "xOpat Linux ${{ inputs.tag || github.ref_name }} (ref=${{ inputs.ref || github.ref_name }})"

on:
  push:
    tags:
      - 'xopat-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. xopat-v1.0.0)'
        required: true
        type: string
      ref:
        description: 'Branch to build from. Leave empty to use the branch selected above.'
        required: false
        type: string
      xopat_ref:
        description: 'xOpat submodule ref (branch, tag, or SHA). Default: release/v3.'
        required: false
        type: string
        default: 'release/v3'

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Checkout xOpat submodule at requested ref
        run: |
          XOPAT_REF="${{ inputs.xopat_ref || 'release/v3' }}"
          git submodule update --init external/xopat
          cd external/xopat
          git fetch origin "$XOPAT_REF"
          git checkout FETCH_HEAD
          echo "xOpat submodule now at $(git rev-parse HEAD) (ref: $XOPAT_REF)"
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pkg
        run: npm install -g pkg

      - name: Run build script
        run: |
          chmod +x scripts/linux/build_xopat.sh
          scripts/linux/build_xopat.sh

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package artifact
        run: |
          cd dist/xopat
          zip -r "../../xopat_linux_${{ steps.tag.outputs.value }}.zip" .

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "xopat_linux_${{ steps.tag.outputs.value }}.zip" \
            > "xopat_linux_${{ steps.tag.outputs.value }}.zip.sha256"
          cat "xopat_linux_${{ steps.tag.outputs.value }}.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: |
            xopat_linux_*.zip
            xopat_linux_*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
